<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; text-align: center; padding: 20px; }
  input, button { font-size: 18px; padding: 10px; }
</style>

<h1 id="title">Join the Game</h1>
<input id="Name" placeholder="Your name">
<button id="Join">Join</button>
<p id="status"></p>
<div id="clock" style="display:none; text-align:center; margin-top:40px">
  <svg viewBox="0 0 200 200" style="width:60vw; max-width:300px; height:auto">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#ddd" stroke-width="12"/>
    <circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="#4a90e2" stroke-width="12"
            stroke-dasharray="565.5" stroke-dashoffset="0" transform="rotate(-90 100 100)"/>
    <text id="clockText" x="100" y="120" text-anchor="middle" font-size="60">5</text>
  </svg>
</div>
<div id="buttons" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
  import { getDatabase, ref, set, onValue, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";
  import { firebaseConfig, colours, shapes } from "./common.js";
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let offset = 0;
  onValue(ref(db, ".info/serverTimeOffset"), (s) => { offset = s.val() || 0; });
  let timer;

  let myName = ""; let myUid = "";
  
  document.getElementById("Join").onclick = async () => {
    const name = document.getElementById("Name").value.trim();
    if (!name) return;
    const { user } = await signInAnonymously(auth);
    await set(ref(db, "players/" + user.uid), { name: name, score: 0 });
    myName = name;
    myUid = user.uid;
    document.getElementById("Name").style.display = "none";
    document.getElementById("Join").style.display = "none";
    document.getElementById("status").textContent = "You're in, " + name+ "! Wait for the host.";
  };

  onValue(ref(db, "state"), (snapshot) => {
    const state = snapshot.val();
    clearInterval(timer);
    if (state) {
      timer = setInterval(() => {
        const now = Date.now() + offset;
        const elapsed = (now - state.startedAt) / 1000;
const left = Math.ceil(5 - elapsed);
if (left > 0) {
  document.getElementById("clock").style.display = "block";
  document.getElementById("clockText").textContent = left;
  document.getElementById("status").textContent = "Get ready, " + myName + "!";
  document.getElementById("title").style.display = "none";
} else {
  clearInterval(timer);
  document.getElementById("clock").style.display = "none";
  showQuestion(state.question, state.startedAt);
}
      }, 200);
    } else {         
      document.getElementById("Name").style.display = "";
      document.getElementById("Join").style.display = "";
      document.getElementById("status").textContent = "";
      document.getElementById("buttons").innerHTML = "";
    }
  });
  async function showQuestion(n, startedAt) {
  const q = (await get(ref(db, "questions/" + n))).val();
  const labels = q.type === "truefalse" ? ["True", "False"]: q.options;
  const box = document.getElementById("buttons");
  box.innerHTML = "";
  document.getElementById("status").textContent = q.text;
    labels.forEach((label, i) => {
    const b = document.createElement("button");
    b.textContent = (q.type === "truefalse" ? "": shapes[i] + " ") + label;
    b.style.cssText = "background:" + colours[i] + "; color:white; font-size:28px; padding:40px 10px; border:none; border-radius:12px";
    b.onclick = async () => {
      await set(ref(db, "answers/" + n + "/" + myUid), { choice: i, at: serverTimestamp() });
      box.innerHTML = "";
      document.getElementById("status").textContent = "Answer locked in";
    };
    box.appendChild(b);
  });

  document.getElementById("clock").style.display = "block";
  clearInterval(timer);
  timer = setInterval(() => {
    const now = Date.now() + offset;
    const left = Math.ceil(q.duration - (now - startedAt - 5000) / 1000);
    if (left > 0) {
      document.getElementById("clockText").textContent = left;
    } else {
      clearInterval(timer);
      document.getElementById("clock").style.display = "none";
      box.innerHTML = "";
      document.getElementById("status").textContent = "Time's up!";
    }
  }, 200);
}
</script>
